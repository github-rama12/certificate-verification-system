<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Certificate Verification</title>

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ================================
           BODY
        ================================= */

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #5A2D82 0%,
                    #1F3B73 50%,
                    #3B82F6 100%
                );

            background-attachment: fixed;
        }


        /* ================================
           MAIN CONTAINER
        ================================= */

        .container {
            width: 100%;
            max-width: 800px;

            overflow: hidden;

            border-radius: 16px;

            background: rgba(26, 26, 26, 0.60);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid
                rgba(255, 255, 255, 0.10);

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.50);
        }


        /* ================================
           HEADER
        ================================= */

        .header {
            padding: 30px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #5A2D82 0%,
                    #1F3B73 50%,
                    #3B82F6 100%
                );
        }


        .header h1 {
            font-size: 28px;

            font-weight: 700;

            margin-bottom: 10px;
        }


        /* ================================
           VERIFIED BADGE
        ================================= */

        .valid-badge {
            display: inline-block;

            padding: 7px 16px;

            border-radius: 20px;

            background:
                rgba(255, 255, 255, 0.20);

            color: white;

            font-size: 12px;

            font-weight: 600;
        }


        /* ================================
           CONTENT
        ================================= */

        .content {
            padding: 40px;

            background:
                rgba(255, 255, 255, 0.95);
        }


        /* ================================
           CERTIFICATE ID
        ================================= */

        .certificate-id {
            padding: 20px;

            margin: 0 0 25px 0;

            text-align: center;

            color: white;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #5A2D82 0%,
                    #1F3B73 50%,
                    #3B82F6 100%
                );
        }


        .id-label {
            font-size: 11px;

            margin-bottom: 5px;

            opacity: 0.9;
        }


        .id-value {
            font-size: 20px;

            font-weight: 700;

            letter-spacing: 0.5px;

            word-break: break-word;
        }


        /* ================================
           SECTION
        ================================= */

        .section {
            margin-bottom: 28px;
        }


        .section-title {
            color: #1F3B73;

            font-size: 15px;

            font-weight: 700;

            padding-bottom: 9px;

            margin-bottom: 14px;

            border-bottom:
                2px solid #3B82F6;
        }


        /* ================================
           INFORMATION GRID
        ================================= */

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(200px, 1fr)
                );

            gap: 14px;
        }


        /* ================================
           INFORMATION BOX
        ================================= */

        .info-item {
            padding: 14px;

            background: #f8f9fa;

            border-radius: 8px;

            border:
                1px solid
                rgba(59, 130, 246, 0.10);
        }


        .info-label {
            color: #666;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 5px;
        }


        .info-value {
            color: #1F3B73;

            font-size: 14px;

            font-weight: 600;

            line-height: 1.4;

            word-break: break-word;
        }


        /* ================================
           FOOTER
        ================================= */

        .footer {
            padding: 18px;

            text-align: center;

            color:
                rgba(255, 255, 255, 0.85);

            font-size: 12px;

            background:
                rgba(26, 26, 26, 0.60);
        }


        /* ================================
           LOADING
        ================================= */

        .loading {
            padding: 30px;

            text-align: center;

            color: #1F3B73;

            font-weight: 600;
        }


        /* ================================
           ERROR
        ================================= */

        .error {
            padding: 30px;

            text-align: center;

            color: #b00020;
        }


        .error h2 {
            margin-bottom: 10px;
        }


        .error p {
            color: #666;

            font-size: 14px;
        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }


            .header {
                padding: 24px 15px;
            }


            .header h1 {
                font-size: 21px;
            }


            .content {
                padding: 22px 16px;
            }


            .id-value {
                font-size: 18px;
            }


            .info-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <div class="container">


        <!-- ================================
             HEADER
        ================================= -->

        <div class="header">

            <h1 id="title">
                ✓ Valid Certificate Verified
            </h1>

            <div
                class="valid-badge"
                id="badge">

                VERIFIED

            </div>

        </div>


        <!-- ================================
             CONTENT
        ================================= -->

        <div class="content">


            <!-- Loading -->

            <div
                class="loading"
                id="loading">

                Verifying certificate...

            </div>


            <!-- Certificate -->

            <div
                id="certificateContent"
                style="display: none;">


                <!-- ================================
                     CERTIFICATE ID
                ================================= -->

                <div class="certificate-id">

                    <div class="id-label">
                        Certificate ID
                    </div>

                    <div
                        class="id-value"
                        id="certificateId">

                        —

                    </div>

                </div>


                <!-- ================================
                     STUDENT INFORMATION
                ================================= -->

                <div class="section">

                    <div class="section-title">
                        Student Information
                    </div>


                    <div class="info-grid">

                        <div class="info-item">

                            <div class="info-label">
                                Student Name
                            </div>

                            <div
                                class="info-value"
                                id="studentName">

                                —

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ================================
                     COURSE DETAILS
                ================================= -->

                <div class="section">

                    <div class="section-title">
                        Course Details
                    </div>


                    <div class="info-grid">


                        <div class="info-item">

                            <div class="info-label">
                                Course Name
                            </div>

                            <div
                                class="info-value"
                                id="courseName">

                                —

                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-label">
                                Category
                            </div>

                            <div
                                class="info-value"
                                id="category">

                                —

                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-label">
                                Duration
                            </div>

                            <div
                                class="info-value"
                                id="duration">

                                —

                            </div>

                        </div>


                        <div class="info-item">

                            <div class="info-label">
                                Company Name
                            </div>

                            <div
                                class="info-value"
                                id="companyName">

                                —

                            </div>

                        </div>


                    </div>

                </div>


                <!-- ================================
                     INTERNSHIP PERIOD
                ================================= -->

                <div class="section">

                    <div class="section-title">
                        Internship Period
                    </div>


                    <div class="info-grid">


                        <!-- ONLY START DATE -->

                        <div class="info-item">

                            <div class="info-label">
                                Start Date
                            </div>

                            <div
                                class="info-value"
                                id="startDate">

                                —

                            </div>

                        </div>


                    </div>

                </div>


            </div>

        </div>


        <!-- ================================
             FOOTER
        ================================= -->

        <div class="footer">

            <p id="footer">
                This certificate has been verified
                and is authentic.
            </p>

        </div>


    </div>


    <!-- ================================
         JAVASCRIPT
    ================================= -->

    <script>


        /*
         * Get Certificate ID
         *
         * Example:
         *
         * /verify/CITS2026AI001
         *
         * Certificate ID:
         *
         * CITS2026AI001
         */

        const pathParts =
            window.location.pathname
                .split("/")
                .filter(Boolean);


        const certificateId =
            decodeURIComponent(
                pathParts[
                    pathParts.length - 1
                ] || ""
            );


        /*
         * Load certificate
         */

        async function loadCertificate() {

            try {


                /* Check ID */

                if (!certificateId) {

                    throw new Error(
                        "Certificate ID is missing."
                    );

                }


                /*
                 * Request certificate
                 * from Node.js backend.
                 */

                const response =
                    await fetch(
                        "/api/certificates/verify/" +
                        encodeURIComponent(
                            certificateId
                        )
                    );


                const data =
                    await response.json();


                /*
                 * Certificate not found
                 */

                if (
                    !response.ok ||
                    !data.certificate
                ) {

                    throw new Error(
                        data.message ||
                        "Certificate not found."
                    );

                }


                const certificate =
                    data.certificate;


                /*
                 * Hide loading
                 */

                document.getElementById(
                    "loading"
                ).style.display = "none";


                /*
                 * Show certificate
                 */

                document.getElementById(
                    "certificateContent"
                ).style.display = "block";


                /*
                 * Verification status
                 */

                const title =
                    document.getElementById(
                        "title"
                    );


                const badge =
                    document.getElementById(
                        "badge"
                    );


                const footer =
                    document.getElementById(
                        "footer"
                    );


                if (data.valid) {

                    title.textContent =
                        "✓ Valid Certificate Verified";

                    badge.textContent =
                        "VERIFIED";

                    footer.textContent =
                        "This certificate has been verified and is authentic.";

                } else {

                    title.textContent =
                        "✕ Certificate Revoked";

                    badge.textContent =
                        "REVOKED";

                    footer.textContent =
                        "This certificate has been revoked.";

                }


                /*
                 * Certificate ID
                 */

                document.getElementById(
                    "certificateId"
                ).textContent =
                    certificate.certificateId;


                /*
                 * Student name
                 */

                document.getElementById(
                    "studentName"
                ).textContent =
                    certificate.studentName || "—";


                /*
                 * Course name
                 */

                document.getElementById(
                    "courseName"
                ).textContent =
                    certificate.courseName || "—";


                /*
                 * Category
                 */

                document.getElementById(
                    "category"
                ).textContent =
                    certificate.category || "—";


                /*
                 * Duration
                 */

                document.getElementById(
                    "duration"
                ).textContent =
                    certificate.duration || "—";


                /*
                 * Company
                 */

                document.getElementById(
                    "companyName"
                ).textContent =
                    certificate.companyName || "—";


                /*
                 * Start date
                 */

                document.getElementById(
                    "startDate"
                ).textContent =
                    certificate.startDate || "—";


                /*
                 * End date has been intentionally removed.
                 */


            } catch (error) {


                /*
                 * Hide loading
                 */

                document.getElementById(
                    "loading"
                ).style.display = "none";


                /*
                 * Show error
                 */

                document.getElementById(
                    "certificateContent"
                ).innerHTML = `

                    <div class="error">

                        <h2>
                            Certificate Not Found
                        </h2>

                        <p>
                            ${escapeHtml(
                                error.message
                            )}
                        </p>

                    </div>

                `;


                document.getElementById(
                    "badge"
                ).textContent =
                    "INVALID";


                document.getElementById(
                    "title"
                ).textContent =
                    "Certificate Verification";

            }

        }


        /*
         * Escape HTML
         */

        function escapeHtml(text) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent = text;

            return div.innerHTML;

        }


        /*
         * Start
         */

        loadCertificate();

    </script>


</body>

</html>
